<!DOCTYPE html>

<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Stunden- und Zeiterfassung fürs Handwerk mit monatlichem Werkstatt-PDF-Export.">
  <meta name="theme-color" content="#15130E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stunden Logbuch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stunden Logbuch</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Push-Benachrichtigungen (Erinnerung Mo-Fr 16:30, falls für heute noch
    kein Eintrag im Logbuch existiert). Bewusst als einzelne globale
    JS-Funktion statt mehrerer einzelner dart:js_interop-Aufrufe - siehe
    lib/services/push_service_web.dart. Registriert einen EIGENEN,
    von Flutter unangetasteten Service-Worker unter web/push/push-sw.js
    mit eigenem Scope "/push/", damit er Flutters eigenen Service-Worker
    (Scope "/", wird bei jedem `flutter build web` neu generiert) nicht
    stört.
  -->
  <script>
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    window.zeiterfassungSubscribePush = async function (vapidPublicKey, authToken) {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
          return 'Push wird von diesem Browser nicht unterstützt.';
        }

        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          return 'Benachrichtigungen wurden nicht erlaubt.';
        }

        const registration = await navigator.serviceWorker.register('/push/push-sw.js', {
          scope: '/push/',
        });
        await navigator.serviceWorker.ready;

        let subscription = await registration.pushManager.getSubscription();
        if (!subscription) {
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(vapidPublicKey),
          });
        }

        const json = subscription.toJSON();
        const response = await fetch('/api/push/subscribe', {
          method: 'POST',
          headers: {
            'content-type': 'application/json',
            authorization: 'Bearer ' + authToken,
          },
          body: JSON.stringify({ endpoint: json.endpoint, keys: json.keys }),
        });

        if (!response.ok) {
          return 'Server hat das Abo abgelehnt (' + response.status + ').';
        }
        return '';
      } catch (e) {
        return 'Fehler: ' + (e && e.message ? e.message : e);
      }
    };
  </script>
</body>
</html>
