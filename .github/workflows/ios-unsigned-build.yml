name: iOS Unsigned Build (für Sideloadly)

# Baut eine UNSIGNIERTE .ipa in der Cloud (kostenlos, keine Apple-Developer-
# Mitgliedschaft nötig) - die Signierung übernimmst du danach selbst mit
# Sideloadly + deiner kostenlosen Apple-ID auf deinem PC.
#
# Manuell starten: GitHub -> Reiter "Actions" -> "iOS Unsigned Build" ->
# "Run workflow". Nach ein paar Minuten findest du die fertige .ipa unter
# dem Workflow-Lauf im Bereich "Artifacts" zum Herunterladen.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Native iOS-Projektdateien sicherstellen
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios --org de.dennis .
          fi

      - name: App-Namen auf dem iPhone setzen ("Stunden Logbuch")
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Stunden Logbuch'" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Stunden Logbuch'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 'Stunden Logbuch'" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleName string 'Stunden Logbuch'" "$PLIST"

      - name: Abhängigkeiten installieren
        run: flutter pub get

      - name: Unsignierten Build erstellen
        run: flutter build ios --release --no-codesign

      - name: In .ipa verpacken
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r zeiterfassung-unsigned.ipa Payload

      - name: .ipa als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: zeiterfassung-unsigned-ipa
          path: zeiterfassung-unsigned.ipa
          retention-days: 14
