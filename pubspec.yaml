name: zeiterfassung
description: "Lokale Stunden- und Zeiterfassung fürs Handwerk mit monatlichem Werkstatt-PDF-Export."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sembast: ^3.7.0 # reine Dart-Datenbank, keine native Kompilierung nötig - läuft identisch auf iOS/Android/Windows
  path: ^1.9.0
  path_provider: ^2.1.3
  intl: any # Version wird von flutter_localizations (Flutter-SDK) vorgegeben
  pdf: ^3.11.0
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
