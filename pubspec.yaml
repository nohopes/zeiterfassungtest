name: zeiterfassung
description: "Stunden Logbuch - Stunden- und Zeiterfassung fürs Handwerk mit Werkstatt-PDF-Export. Reine Web/PWA-App, Daten liegen auf dem Backend-Server (siehe server/)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # Version wird von flutter_localizations (Flutter-SDK) vorgegeben
  pdf: ^3.11.0
  printing: ^5.13.1
  http: ^1.6.0 # REST-Aufrufe an den Backend-Server
  shared_preferences: ^2.5.5 # Login-Token zwischen Sitzungen merken

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
