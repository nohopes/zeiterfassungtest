name: zeiterfassung_server
description: >
  Backend für die Zeiterfassung-PWA. Reine Dart-Anwendung (kein Flutter
  nötig) - stellt eine kleine REST-API bereit und speichert alle Einträge
  dauerhaft über sembast in einer Datei auf einem Docker-Volume, statt sie
  nur lokal im Browser abzulegen.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  sembast: ^3.7.0
  bcrypt: ^1.2.0
  # Für Push-Benachrichtigungen (VAPID-Signatur + RFC-8291-Verschlüsselung),
  # von Hand nach RFC implementiert (siehe lib/web_push.dart). Bewusst NICHT
  # `webcrypto`/`webpush_encryption`: die nutzen Native-Build-Hooks, die mit
  # `dart compile exe` (siehe Dockerfile) nicht kompatibel sind - pointycastle
  # ist reines Dart ohne native Abhängigkeiten.
  pointycastle: ^3.7.0
  # Für die 16:30-Erinnerung Mo-Fr in Europe/Berlin-Zeit (korrekte
  # Sommer-/Winterzeit-Umstellung ohne selbstgebaute Offset-Berechnung).
  timezone: ^0.11.1
  # Für den automatischen Monats-E-Mail-Versand (server-seitiger Nachbau des
  # Werkstatt-PDFs, siehe lib/pdf_report.dart) - reines Dart, keine
  # Flutter-Abhängigkeit nötig.
  pdf: ^3.11.0
  # Reiner Dart-SMTP-Client für den Mail-Versand (siehe "Eigener
  # SMTP-Zugang" in bin/server.dart) - bewusst kein Cloud-E-Mail-Dienst.
  mailer: ^7.2.0
  # Für deutsche Monats-/Wochentagsnamen im Server-PDF (z. B. "August 2026",
  # "Mo, 03.08.2026") - reines Dart, unabhängig von flutter_localizations.
  intl: ^0.19.0

dev_dependencies:
  lints: ^4.0.0
